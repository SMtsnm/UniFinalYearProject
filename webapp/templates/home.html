<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Cybersecurity Threat Simulator - Home</title>

    <!-- link css file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<h1>Cybersecurity Threat Simulator</h1>

<h2>User Authentication</h2>

<!-- shows who is currently logged in -->
<p><strong>Logged in user:</strong> <span id="loggedInUser">None</span></p>

<label for="emailInput"><strong>Email:</strong></label>
<input type="email" id="emailInput" placeholder="Enter email">

<label for="passwordInput"><strong>Password:</strong></label>
<input type="password" id="passwordInput" placeholder="Enter password">

<button id="registerBtn">Register</button>
<button id="loginBtn">Login</button>

<hr>

<!-- user picks difficulty and scenario before starting -->
<label for="difficultySelect"><strong>Difficulty:</strong></label>
<select id="difficultySelect">
    <option value="easy" selected>Easy</option>
    <option value="medium">Medium</option>
    <option value="hard">Hard</option>
</select>

<label for="attackTypeSelect"><strong>Attack Type:</strong></label>
<select id="attackTypeSelect">
    <option value="phishing" selected>IT Support Phishing</option>
    <option value="delivery">Delivery Scam</option>
</select>

<button id="startBtn">Start Simulation</button>

<script>
// keeps track of logged in user on this page
let currentUserId = null;

// register new user
async function registerUser() {
    const email = document.getElementById('emailInput').value;
    const password = document.getElementById('passwordInput').value;

    // send register details to backend
    const response = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    // show success or error message
    if (response.ok) {
        alert(data.message);
    } else {
        alert(data.error || 'Registration failed');
    }
}

// login existing user
async function loginUser() {
    const email = document.getElementById('emailInput').value;
    const password = document.getElementById('passwordInput').value;

    // send login details to backend
    const response = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (response.ok) {
        // save user info for later pages
        currentUserId = data.user_id;
        localStorage.setItem('currentUserId', data.user_id);
        localStorage.setItem('currentUserEmail', email);

        // update logged in text on page
        document.getElementById('loggedInUser').textContent = `${email} (ID: ${data.user_id})`;
        alert(data.message);
    } else {
        alert(data.error || 'Login failed');
    }
}

// start a new simulation
async function startSimulation() {
    const selectedDifficulty = document.getElementById('difficultySelect').value;
    const selectedAttackType = document.getElementById('attackTypeSelect').value;

    // get saved user id from browser storage
    const userId = localStorage.getItem('currentUserId');

    // create simulation in backend
    const response = await fetch('/start_simulation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            difficulty: selectedDifficulty,
            attack_type: selectedAttackType,
            user_id: userId
        })
    });

    const data = await response.json();

    // save simulation id so test page knows which one to use
    localStorage.setItem('currentSimulationId', data.simulation_id);

    // go to test page
    window.location.href = '/test';
}

// reload saved login info when page opens
window.addEventListener('load', () => {
    const savedUserId = localStorage.getItem('currentUserId');
    const savedEmail = localStorage.getItem('currentUserEmail');

    if (savedUserId && savedEmail) {
        currentUserId = savedUserId;
        document.getElementById('loggedInUser').textContent = `${savedEmail} (ID: ${savedUserId})`;
    }
});

// button click events
document.getElementById('registerBtn').addEventListener('click', registerUser);
document.getElementById('loginBtn').addEventListener('click', loginUser);
document.getElementById('startBtn').addEventListener('click', startSimulation);
</script>

</body>
</html>
